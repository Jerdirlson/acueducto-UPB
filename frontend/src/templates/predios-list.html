<div>
  <div class="flex justify-between items-center mb-6 flex-wrap gap-2">
    <h2 class="text-2xl font-bold text-slate-800">Listado de Predios</h2>
    <div class="flex gap-2">
      <button id="export-pdf-btn" class="flex items-center justify-center gap-2 px-4 py-2.5 rounded font-medium bg-slate-600 text-white hover:bg-slate-700 shadow-sm">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Exportar PDF
      </button>
      <button id="new-property-btn" class="flex items-center justify-center gap-2 px-4 py-2.5 rounded font-medium bg-upb-red text-white hover:bg-pink-700 shadow-sm">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Nuevo
      </button>
    </div>
  </div>

  <!-- Search and Filters Section -->
  <div id="search-filters-section"></div>

  <!-- Status Filter -->
  <div class="mb-4 flex gap-2 flex-wrap">
    <button data-filter-status="all" class="filter-status-btn px-4 py-2 rounded-lg border-2 border-slate-300 text-slate-700 hover:bg-slate-50 font-medium active">
      Todos
    </button>
    <button data-filter-status="Activo" class="filter-status-btn px-4 py-2 rounded-lg border-2 border-slate-300 text-slate-700 hover:bg-slate-50 font-medium">
      Activos
    </button>
    <button data-filter-status="Suspendido" class="filter-status-btn px-4 py-2 rounded-lg border-2 border-slate-300 text-slate-700 hover:bg-slate-50 font-medium">
      Suspendidos
    </button>
    <button data-filter-status="Inactivo" class="filter-status-btn px-4 py-2 rounded-lg border-2 border-slate-300 text-slate-700 hover:bg-slate-50 font-medium">
      Inactivos
    </button>
  </div>

  <div class="grid grid-cols-1 gap-4" id="properties-list">
    <!-- Los predios se inyectarán aquí dinámicamente -->
  </div>
</div>
