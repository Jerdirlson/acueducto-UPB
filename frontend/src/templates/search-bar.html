<div class="mb-6 space-y-4">
  <!-- Search Input -->
  <div class="relative">
    <input
      type="text"
      id="search-input"
      placeholder="Buscar..."
      class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-upb-red focus:border-transparent"
    />
    <svg
      class="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <circle cx="11" cy="11" r="8"/>
      <path d="m21 21-4.35-4.35"/>
    </svg>
  </div>

  <!-- Filter Chips Container -->
  <div id="filter-chips" class="flex flex-wrap gap-2">
    <!-- Active filters will be injected here -->
  </div>

  <!-- Clear Filters Button (hidden by default) -->
  <button
    id="clear-filters-btn"
    class="hidden text-sm text-upb-red hover:underline font-medium"
  >
    Limpiar filtros
  </button>
</div>
