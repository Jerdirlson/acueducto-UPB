<div class="flex items-center justify-between mt-6 pt-4 border-t border-slate-200">
  <div class="text-sm text-slate-600">
    Mostrando <span class="font-semibold">{{start}}</span> - <span class="font-semibold">{{end}}</span> de <span class="font-semibold">{{total}}</span> registros
  </div>
  <div class="flex items-center gap-2">
    <button
      id="pagination-prev"
      class="px-3 py-2 rounded border border-slate-300 text-slate-700 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed"
      {{prevDisabled}}
    >
      Anterior
    </button>
    <div class="flex items-center gap-1">
      <span class="text-sm text-slate-600">Página</span>
      <input
        type="number"
        id="pagination-page-input"
        min="1"
        max="{{totalPages}}"
        value="{{currentPage}}"
        class="w-16 px-2 py-1 text-center border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-upb-red"
      />
      <span class="text-sm text-slate-600">de {{totalPages}}</span>
    </div>
    <button
      id="pagination-next"
      class="px-3 py-2 rounded border border-slate-300 text-slate-700 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed"
      {{nextDisabled}}
    >
      Siguiente
    </button>
  </div>
</div>
